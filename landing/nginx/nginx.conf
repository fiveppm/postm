# postmonster: nginx main config for the static landing (PRD A1).
# ngx_brotli (filter + static) is loaded as dynamic modules built in the Dockerfile.

load_module /etc/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/rss+xml image/svg+xml;

  # precompressed copies are written at image build (see Dockerfile)
  gzip_static on;
  brotli on;
  brotli_comp_level 6;
  brotli_static on;
  brotli_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
